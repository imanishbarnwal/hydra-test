name: hydra

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Static site: no dependencies or build. Stage index.html into a clean
      # output folder so .git and the publish script are not uploaded.
      - run: mkdir -p site && cp index.html site/
      - name: Publish to Hydra
        env:
          HYDRA_API_URL: https://hydra-api-5xmn.onrender.com
          HYDRA_API_KEY: ${{ secrets.HYDRA_API_KEY }}
        run: |
          curl -fsSL "$HYDRA_API_URL/publish.mjs" -o hydra-publish.mjs
          node hydra-publish.mjs site
